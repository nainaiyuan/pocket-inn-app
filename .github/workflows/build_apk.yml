name: Build APK

# 手动触发编译（Actions 页面 → Run workflow），不随 push 自动跑
# APK 通过 GitHub Releases 交付（固定 tag: latest-apk），不占 artifact 配额
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '构建模式'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      # Gradle 缓存：第二次起跳过下载，大幅加速
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build APK
        run: flutter build apk --${{ github.event.inputs.mode }}

      # 上传到固定 Release（latest-apk），下载链接永远不变
      - name: Upload APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="build/app/outputs/flutter-apk/app-${{ github.event.inputs.mode }}.apk"
          REPO="${{ github.repository }}"
          if gh release view latest-apk --repo "$REPO" >/dev/null 2>&1; then
            gh release upload latest-apk "$APK" --repo "$REPO" --clobber
          else
            gh release create latest-apk "$APK" --repo "$REPO" --title "最新 APK" --notes "手动触发编译的最新 APK"
          fi
          echo "下载地址: https://github.com/$REPO/releases/tag/latest-apk"
