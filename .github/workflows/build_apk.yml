name: Build APK

# 手动触发编译（Actions 页面 → Run workflow），不随 push 自动跑
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '构建模式'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      # Gradle 缓存：第二次起跳过下载，大幅加速
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build APK
        run: flutter build apk --${{ github.event.inputs.mode }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-inn-apk-${{ github.event.inputs.mode }}
          path: build/app/outputs/flutter-apk/app-${{ github.event.inputs.mode }}.apk
          retention-days: 14
