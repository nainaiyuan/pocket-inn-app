name: Build APK

# 手动触发编译（Actions 页面 → Run workflow），不随 push 自动跑
# APK 通过 GitHub Releases 交付（固定 tag: latest-apk），不占 artifact 配额
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '构建模式'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      # 语义情绪模型缓存：154MB 每次重下很慢，缓存后第二次起秒过
      # 模型更新时把 key 的 v1 改成 v2 即可强制刷新
      - name: Cache emotion model
        uses: actions/cache@v4
        with:
          path: assets/models
          key: emotion-model-v1

      # 下载语义情绪模型（154MB int8 量化，托管在 model-assets Release；
      # 超过 GitHub 单文件 100MB 限制，不能进 git 仓库）
      - name: Download emotion model assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets/models
          if [ -f assets/models/model_int8.onnx ] && [ -f assets/models/tokenizer.json ]; then
            echo "模型已缓存，跳过下载"
            ls -la assets/models/
            exit 0
          fi
          REPO="${{ github.repository }}"
          gh release download model-assets --repo "$REPO" \
            --pattern "model_int8.onnx" --dir assets/models --clobber
          gh release download model-assets --repo "$REPO" \
            --pattern "tokenizer.json" --dir assets/models --clobber
          ls -la assets/models/

      # Gradle 缓存：第二次起跳过下载，大幅加速
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build APK
        run: flutter build apk --${{ github.event.inputs.mode }}

      # 上传到固定 Release（latest-apk），下载链接永远不变
      - name: Upload APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="build/app/outputs/flutter-apk/app-${{ github.event.inputs.mode }}.apk"
          REPO="${{ github.repository }}"
          if gh release view latest-apk --repo "$REPO" >/dev/null 2>&1; then
            # 清理该 release 下所有旧 APK（防止 debug/release 积累占存储）
            gh release view latest-apk --repo "$REPO" --json assets \
              -q '.assets[].name' | grep '\.apk$' | while read -r name; do
              aid=$(gh release view latest-apk --repo "$REPO" --json assets \
                -q ".assets[] | select(.name==\"$name\") | .id")
              [ -n "$aid" ] && gh api -X DELETE "repos/$REPO/releases/assets/$aid" || true
            done
            gh release upload latest-apk "$APK" --repo "$REPO" --clobber
          else
            gh release create latest-apk "$APK" --repo "$REPO" --title "最新 APK" --notes "手动触发编译的最新 APK"
          fi
          echo "下载地址: https://github.com/$REPO/releases/tag/latest-apk"
