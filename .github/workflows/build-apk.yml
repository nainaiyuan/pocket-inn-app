name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: '编译模式'
        type: choice
        options:
          - release
          - debug
        default: release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Cache build_runner outputs
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/build
            .dart_tool/package_config.json
          key: build-runner-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('lib/**/*.dart') }}
          restore-keys: |
            build-runner-${{ hashFiles('pubspec.lock') }}-
            build-runner-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --${{ github.event.inputs.build_mode || 'release' }} --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_mode || 'release' }}
          path: build/app/outputs/flutter-apk/app-release.apk
